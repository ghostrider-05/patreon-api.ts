name: Pull Request
on:
  - pull_request
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test_coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    # Only needs to run on head branch since that will become the new base
    # and coverage needs to pass before merging
    continue-on-error: true
    strategy:
      matrix:
        include:
          - branch: main
            artifact: main
          - branch: ${{ github.head_ref }}
            artifact: pull-request
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}

      - name: Install node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm run install-ci

      - name: Run tsc
        run: npm run prestart

      - name: Run test coverage
        run: npm run test:coverage

      - name: "Upload Coverage"
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.artifact }}
          path: src/coverage
  report_coverage:
    name: Report PR coverage
    runs-on: ubuntu-latest
    needs: test_coverage
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Download Coverage Artifacts
        uses: actions/download-artifact@v8
        with:
          name: coverage-pull-request
          path: src/coverage

      - uses: actions/download-artifact@v8
        with:
          name: coverage-main
          path: src/coverage-main

      - name: Report coverage
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          vite-config-path: vitest.config.mts
          json-final-path: src/coverage/coverage-final.json
          json-summary-path: src/coverage/coverage-summary.json
          json-summary-compare-path: src/coverage-main/coverage-summary.json
  update-packages:
    name: Update package
    runs-on: ubuntu-latest
    # Only on release PRs
    if: ${{ github.event.pull_request.labels.id == 6810208387 }}
    strategy:
      matrix:
        directory:
          - ./apps/worker-docs/
          - ./docs/
          - ./examples/cloudflare-webhook/
          - ./examples/express-webhook/
          - ./examples/nodejs-cjs/
          - ./examples/nodejs-esm/
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm run install-ci

      - name: Update package
        run: npm install patreon-api.ts

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: ${{ github.ref_name }}
          commit_message: Update patreon-api.ts in ${{ matrix.directory }}