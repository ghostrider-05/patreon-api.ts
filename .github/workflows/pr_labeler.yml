name: Pull Request labels
on:
  - pull_request_target
jobs:
  labeler:
    name: Pull Request labeler
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - uses: actions/labeler@v7
      with:
        repo-token: '${{ secrets.GITHUB_TOKEN }}'
        sync-labels: true
